<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelTown</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://pixeltown-server.onrender.com/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="loginBox">
        <h1>PixelTown</h1>
        <button onclick="createRoom()">방 만들기</button>
        <div id="myRoomCode" style="display:none;"></div>
        <div class="join-area">
            <input type="text" id="inviteCode" placeholder="초대코드 입력">
            <button onclick="joinRoom()">방 입장</button>
        </div>
    </div>

    <div id="characterSelect" style="display:none;">
        <h2>캐릭터 선택</h2>
        <input type="text" id="nickname" placeholder="닉네임을 입력하세요">
        <div class="avatar-container">
            <button onclick="prevAvatar()">◀</button>
            <div class="avatar-view">
                <img id="selectedAvatar" src="./assets/beachboy.front.png" alt="아바타">
                <div class="avatarName">비치 보이</div>
            </div>
            <button onclick="nextAvatar()">▶</button>
        </div>
        <button onclick="startGame()">게임 시작</button>
    </div>

    <div id="gameScreen" style="display:none;">
        <canvas id="gameCanvas" width="860" height="600"></canvas>
        <div id="chatBox">
            <div id="messages"></div>
            <input type="text" id="chatInput" placeholder="채팅을 입력하세요...">
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
