<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixelTown</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>


<div id="loginBox">

<h1>PixelTown</h1>


<button onclick="createRoom()">
방 만들기
</button>


<p id="myRoomCode"></p>


<hr>


<input id="inviteCode" placeholder="초대 코드">


<button onclick="joinRoom()">
입장
</button>


<p id="message"></p>


</div>




<div id="characterSelect" style="display:none;">


<h2>캐릭터 선택</h2>


<input id="nickname" placeholder="닉네임">


<br><br>


<button onclick="startGame()">
게임 시작
</button>


</div>





<div id="gameScreen" style="display:none;">


<canvas
id="gameCanvas"
width="800"
height="600">
</canvas>


<div id="chatBox">

<div id="messages"></div>

<input id="chatInput" placeholder="채팅">

</div>


</div>




<!-- 반드시 한번만 -->
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

<script src="./main.js"></script>


</body>

</html>
